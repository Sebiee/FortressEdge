name: ci

on:
  pull_request:
  push:
    branches: [main]
  # dependabot-tidy.yml starts CI again on a Dependabot branch it tidied:
  # a push made with GITHUB_TOKEN starts no workflow by itself. base is the
  # pull request's base, which perf-guard compares with.
  workflow_dispatch:
    inputs:
      base:
        description: The commit perf-guard compares with, a pull request's base
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Modules tidy
        run: make tidy-check
      - name: Unit tests
        run: make test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-cache
          key: apt-${{ hashFiles('os/ci-apt.sh') }}
      - name: Install QEMU and syslinux
        run: os/ci-apt.sh
      - name: Cache Alpine kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/alpine
          key: alpine-${{ hashFiles('os/alpine.sh') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: System tests
        env:
          GOTESTSUM_FORMAT: github-actions
        run: make e2e
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e
          path: out/e2e/

  # What a request costs the edge in CPU and allocations, against the
  # commit this one builds on, at a rate a 2-core runner sustains; see
  # docs/development.md#perf-guard. Throughput on such a runner measures
  # the runner, so it is not what this checks.
  # Whether a pull request changes what the edge runs, or how the perf
  # guard measures it. Anything else (docs, tools, other tests) skips it.
  changes:
    if: github.event_name == 'pull_request' || inputs.base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      edge: ${{ steps.diff.outputs.edge }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Paths
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          edge=false
          if git diff --name-only "$BASE" HEAD | grep -qE \
            '^(cmd/fortressedge/|internal/|bake/|bpf/|os/|go\.(mod|sum)$|Makefile$|test/e2e/(lab/|go\.(mod|sum)$|testdata/perf-baseline\.json$|(perf|bench|openappsec|wire)_test\.go$)|\.github/workflows/ci\.yml$)'; then
            edge=true
          fi
          echo "edge=$edge" >> "$GITHUB_OUTPUT"

  # What a request costs the edge, against the pull request's base: only
  # for pull requests, since a merge adds nothing its pull request did not
  # measure.
  perf-guard:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-cache
          key: apt-${{ hashFiles('os/ci-apt.sh') }}
      - name: Install QEMU and syslinux
        run: os/ci-apt.sh
      - name: Cache Alpine kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/alpine
          key: alpine-${{ hashFiles('os/alpine.sh') }}
      - name: Cache open-appsec datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/openappsec
          key: openappsec-${{ hashFiles('test/e2e/testdata/openappsec.sha256') }}
      - name: Cache the base's bench ISO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/base-iso
          key: perf-base-${{ github.event.pull_request.base.sha || inputs.base }}
      # os/netns.sh makes the bench's tap in an unprivileged user namespace,
      # which Ubuntu 24.04's AppArmor forbids by default.
      - name: Enable KVM, user namespaces and vhost-net
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe vhost_net
          sudo chmod 0666 /dev/vhost-net
      - name: Perf guard
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: make perf-guard BASE="$BASE"
      - name: Summary
        if: always()
        run: cat out/waf-bench/perf-guard-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-guard-${{ github.sha }}
          path: out/waf-bench/
          retention-days: 30
